# 中文说明：沿用用户的下载、缓存、编译、日志、artifact 和 release 流程。
# 三款设备使用独立任务、配置和产物；每日北京时间 00:16 构建。
name: ImmortalWrt_H66K_H68K_H69K

on:
  workflow_dispatch:
    inputs:
      device:
        description: 选择机型（all 分别生成三款固件）
        type: choice
        options: [all, h66k, h68k, h69k]
        default: all
      source_ref:
        description: ImmortalWrt 分支或提交 SHA
        type: string
        default: master
      allow_config_drift:
        description: 允许非核心配置缺失（会在报告中列明；默认禁止）
        type: boolean
        default: false
      upload_release:
        description: 编译通过后发布为测试版 Release
        type: boolean
        default: true
  schedule:
    - cron: '16 16 * * *'

permissions:
  contents: read

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  TZ: Asia/Shanghai
  JOBS: '2'
  UPLOAD_BIN: 'true'
  UPLOAD_FIRMWARE: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      devices: ${{ steps.matrix.outputs.devices }}
    steps:
      - name: 生成独立机型矩阵
        id: matrix
        env:
          DEVICE: ${{ inputs.device || 'all' }}
        run: |
          case "$DEVICE" in
            all) echo 'devices=["h66k","h68k","h69k"]' >> "$GITHUB_OUTPUT" ;;
            h66k|h68k|h69k) printf 'devices=["%s"]\n' "$DEVICE" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac

  build:
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.select.outputs.devices) }}
    env:
      BOARD: ${{ matrix.device }}
      OPENWRT_DIR: ${{ github.workspace }}/openwrt
      ALLOW_CONFIG_DRIFT: ${{ inputs.allow_config_drift && 'true' || 'false' }}
    steps:
      - name: 加载项目文件
        uses: actions/checkout@v4
      - name: 释放预装工具空间
        run: |
          # 只删除 runner 的预装 SDK，保留构建所需程序。
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h
      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-dev python3-pyelftools python3-yaml python3-ply rsync swig unzip \
            zlib1g-dev file wget curl ccache cmake ninja-build libelf-dev llvm lld \
            libglib2.0-dev libfdt-dev device-tree-compiler dwarves qemu-utils \
            libgmp-dev libmpc-dev libmpfr-dev xsltproc libtool autoconf automake \
            autopoint pkgconf help2man zstd xz-utils subversion texinfo patch
      - name: 下载 ImmortalWrt 主源码并记录版本
        env:
          SOURCE_REF: ${{ inputs.source_ref || 'master' }}
        run: |
          git init openwrt
          git -C openwrt remote add origin "$REPO_URL"
          git -C openwrt fetch --depth 1 origin "$SOURCE_REF"
          git -C openwrt checkout --detach FETCH_HEAD
          echo "WRT_HASH=$(git -C openwrt rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date +'%Y.%m.%d-%H.%M')" >> "$GITHUB_ENV"
      - name: 缓存下载文件和编译对象
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
          key: h6xk-v1-${{ runner.os }}-${{ matrix.device }}-${{ env.WRT_HASH }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            h6xk-v1-${{ runner.os }}-${{ matrix.device }}-${{ env.WRT_HASH }}-
            h6xk-v1-${{ runner.os }}-${{ matrix.device }}-
      - name: DIY1 插件、DIY2 默认设置及配置审计
        run: bash scripts/build.sh prepare
      - name: 下载安装包
        run: bash scripts/build.sh download
      - name: 编译固件
        id: compile
        run: bash scripts/build.sh compile
      - name: 检查并整理当前机型固件
        run: bash scripts/build.sh collect
      - name: 上传 bin 目录
        if: success() && env.UPLOAD_BIN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.device }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: openwrt/bin/
          retention-days: 7
      - name: 上传独立机型固件
        if: success() && env.UPLOAD_FIRMWARE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.device }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: firmware/
          if-no-files-found: error
          retention-days: 14
      - name: 始终保留错误诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.device }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build-logs/
            openwrt/logs/
            openwrt/.config
            openwrt/.config.requested
          include-hidden-files: true
          retention-days: 14
      - name: 查看磁盘使用情况
        if: always()
        run: df -hT

  release:
    # 只有本次选中的所有机型均成功时才发布。
    needs: [select, build]
    if: github.event_name == 'schedule' || inputs.upload_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 下载三款分别命名的产物
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: artifacts
      - name: 按机型打包并生成说明
        run: |
          mkdir release
          for dir in artifacts/firmware-*; do
            name="$(basename "$dir")"
            tar -czf "release/$name.tar.gz" -C "$dir" .
          done
          cat >release.txt <<'EOF'
          H66K / H68K / H69K 是三个独立固件包，请只下载与机型对应的文件。
          主源码为 ImmortalWrt，设备树与引导配置参考 iStoreOS 25.12。
          此发布仅表示 CI 构建及镜像压缩校验通过，尚未代表实机启动验证。
          每包包含配置、源码版本、配置差异报告和 SHA256 校验值。
          无线名称对应 H66K、H68K、H69K，默认无密码；IPv4全锥NAT、软件分载、BBRv3 默认启用。
          感谢 OpenWrt、ImmortalWrt、iStoreOS 及插件作者。
          EOF
      - name: 发布测试版固件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: h6xk-${{ github.run_id }}-${{ github.run_attempt }}
          name: H6xK 独立固件 ${{ github.run_id }}
          prerelease: true
          body_path: release.txt
          files: release/*.tar.gz
          fail_on_unmatched_files: true
